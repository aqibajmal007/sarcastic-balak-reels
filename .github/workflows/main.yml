
name: Sarcastic Balak Reel Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      
      - name: Install FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          
          python -m pip install --disable-pip-version-check imageio-ffmpeg google-api-python-client google-auth

          echo "$(python -c 'import imageio_ffmpeg, os; print(os.path.dirname(imageio_ffmpeg.get_ffmpeg_exe()))')" >> "$GITHUB_PATH"

      - name: Test Google Sheet Connection
        env:
          MEME_API_URL: ${{ secrets.MEME_API_URL }}
          MEME_API_KEY: ${{ secrets.MEME_API_KEY }}
        run: python test_sheet_api.py


      - name: Download Funny Clips
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python download_clips.py


      - name: Run Reel Generator

        env:
          CLIPS_DATA_FILE: clips_data.json

        run: python generate_reel.py
      - name: Upload Reel Video
        uses: actions/upload-artifact@v4
        with:
          name: sarcastic-balak-reel
          path: sarcastic_balak_reel.mp4
          if-no-files-found: error
