
name: Sarcastic Balak Reel Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Reel Generator
        run: python generate_reel.py
      - name: Upload Reel Video
        uses: actions/upload-artifact@v4
        with:
          name: sarcastic-balak-reel
          path: sarcastic_balak_reel.mp4
          if-no-files-found: error
