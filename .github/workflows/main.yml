
name: Sarcastic Balak Reel Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      
      - name: Install FFmpeg
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          echo "$(python -c 'import imageio_ffmpeg, os; print(os.path.dirname(imageio_ffmpeg.get_ffmpeg_exe()))')" >> "$GITHUB_PATH"


      - name: Run Reel Generator
        run: python generate_reel.py
      - name: Upload Reel Video
        uses: actions/upload-artifact@v4
        with:
          name: sarcastic-balak-reel
          path: sarcastic_balak_reel.mp4
          if-no-files-found: error
